name: octave reference cross-validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  octave-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # refs/bmd is a git submodule pointing at olivertschmidt/bmd, the
          # original MATLAB reference (research/non-commercial license) --
          # tracked as a pointer, never vendored, so it needs its own checkout
          submodules: true

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: setup.cfg

      - name: Install Octave
        run: sudo apt-get update && sudo apt-get install -y octave

      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[test]'

      # cross-validates PyBMD against the real bmd.m/cbmd.m under Octave; see
      # docs/octave_cross_validation.md for the method and measured tables
      - run: pytest tests/test_octave_reference.py -q
