name: optimizer tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  optimizers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: setup.cfg

      - run: python -m pip install --upgrade pip
      # importing pybmd.bmd.optimizers runs pybmd/__init__.py, which pulls in
      # base/standard/cross and therefore the full dependency set -- a
      # trimmed numpy+scipy-only install would fail at import time
      - run: pip install -e '.[test]'

      # from the repo root: tests/optimizers has no __init__.py, so pytest
      # prepends that directory to sys.path and `from conftest import ...`
      # resolves. Do not `cd tests/optimizers` first.
      - run: pytest tests/optimizers -q
